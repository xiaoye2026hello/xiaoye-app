name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Compile iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Resolve scheme name
        id: scheme
        run: |
          cd ios
          echo "== all schemes in workspace =="
          xcodebuild -workspace *.xcworkspace -list -json | jq -r '.workspace.schemes[]'
          SCHEME=$(node -p "require('../app.json').expo.name")
          if ! xcodebuild -workspace *.xcworkspace -list | sed -n '/Schemes:/,$p' | grep -qx "[[:space:]]*$SCHEME"; then
            echo "app.json name [$SCHEME] not found in workspace, falling back"
            SCHEME=$(xcodebuild -workspace *.xcworkspace -list -json | jq -r '.workspace.schemes[]' | grep -v -E '^(boost|Pods)' | head -1)
          fi
          echo "using scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build without code signing
        run: |
          cd ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle produced, dumping build products:"
            ls -R ios/build/Build/Products/ || true
            exit 1
          fi
          echo "app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -ry Hello-unsigned.ipa Payload
          ls -lh Hello-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: Hello-unsigned.ipa
          retention-days: 30
