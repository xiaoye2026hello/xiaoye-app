name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Compile Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Expo 生成的 release 构建默认沿用 debug 签名。
      # 因此直接把固定 keystore 放到 debug.keystore 的位置，
      # 就能让每次构建的 APK 使用同一套签名，后续版本可覆盖安装。
      - name: Install fixed signing key
        run: |
          KS=android-signing/release.keystore
          if [ -f "$KS" ]; then
            echo "复用仓库中的签名文件"
          else
            echo "首次构建，生成固定签名文件"
            mkdir -p android-signing
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=Xiaoye App, OU=Mobile, O=Xiaoye, L=Beijing, ST=Beijing, C=CN"
          fi
          cp "$KS" android/app/debug.keystore
          echo "签名文件已就位"
          keytool -list -keystore android/app/debug.keystore -storepass android | tail -3

      - name: Tune gradle
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties

      # Expo SDK 58 的 inline modules 任务会把 Gradle 传入的参数直接 JSON.parse，
      # 而该参数在我们的项目里不可解析，导致 :expo:generateInlineModules 失败。
      # 本项目没有内联模块，解析失败时回退为空数组即为正确结果。
      - name: Patch inline modules parser
        run: |
          cat > /tmp/patch-autolinking.js <<'PATCH_EOF'
          const fs = require('fs');
          const p = 'node_modules/expo-modules-autolinking/build/commands/mirrorKotlinInlineModulesCommand.js';
          let s = fs.readFileSync(p, 'utf8');
          const from = 'const watchedDirectories = JSON.parse(watchedDirectoriesSerialized);';
          const to = 'let watchedDirectories = []; try { watchedDirectories = JSON.parse(watchedDirectoriesSerialized); } catch (e) { console.warn("[patch] unusable inline modules arg: " + JSON.stringify(watchedDirectoriesSerialized)); }';
          if (!s.includes(from)) {
            console.log('target statement not found, skipping patch');
            process.exit(0);
          }
          fs.writeFileSync(p, s.replace(from, to));
          console.log('patch applied');
          PATCH_EOF
          node /tmp/patch-autolinking.js
          grep -n "watchedDirectories = \[\]" node_modules/expo-modules-autolinking/build/commands/mirrorKotlinInlineModulesCommand.js

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有产出 apk，列出构建输出目录"
            find android/app/build/outputs -type f | head -40
            exit 1
          fi
          echo "apk: $APK"
          cp "$APK" xiaoye.apk
          ls -lh xiaoye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoye-apk
          path: xiaoye.apk
          retention-days: 30
          compression-level: 0

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: android-signing/release.keystore
          retention-days: 90
          compression-level: 0
